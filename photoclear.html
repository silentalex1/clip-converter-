<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Enhance - Clip Converter</title>
    <link rel="stylesheet" href="photo.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-btn go-back-btn">Go Back</a>
        <div class="nav-buttons">
            <a href="accountcreation.html" class="signin-btn" id="signin-btn">Sign In</a>
        </div>
    </nav>

    <main class="container">
        <div class="animation-text-container">
            <h1 class="animation-text">
                <span class="word picture">Picture</span>
                <span class="word">it,</span>
                <span class="word see">see</span>
                <span class="word">it.<span class="underline"></span></span>
            </h1>
        </div>

        <div class="file-upload-container" id="file-upload-container">
            <label for="file-upload" class="custom-file-upload">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="80" height="80"><path d="M20 4v12h-1.5c-0.276 0-0.5.224-0.5.5s0.224.5 0.5.5h2c0.552 0 1-0.448 1-1v-13c0-0.552-0.448-1-1-1h-17c-0.552 0-1 0.448-1 1v13c0 0.552 0.448 1 1 1h14.5c0.276 0 0.5-0.224 0.5-0.5s-0.224-0.5-0.5-0.5h-14v-12h16zM8.5 12c1.381 0 2.5-1.119 2.5-2.5s-1.119-2.5-2.5-2.5-2.5 1.119-2.5 2.5 1.119 2.5 2.5 2.5zM17 14l-4.5-4.5-2.5 2.5-1.5-1.5-4.5 4.5v1h13v-1z" fill="#ffffff"></path></svg>
                <span>Select a Photo</span>
            </label>
            <input id="file-upload" type="file" accept="image/png, image/jpeg, image/webp">
        </div>
        
        <div class="processing-container" id="processing-container">
            <div class="loading-bar-wrapper">
                <div class="loading-bar"></div>
                <span class="loading-percent">0%</span>
            </div>
        </div>

        <section class="conversion-section" id="conversion-section">
            <div class="photo-editor-wrapper">
                <div class="comparison-slider" id="comparison-slider">
                    <img id="before-image" src="" alt="Before">
                    <div class="after-image-container" id="after-image-container">
                        <img id="after-image" src="" alt="After">
                    </div>
                    <div class="slider-line"></div>
                    <div class="slider-handle"></div>
                </div>
                <div class="brightness-control">
                    <svg class="brightness-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8M12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,11H23V13H20V11M1,11H4V13H1V11M13,1V4H11V1H13M13,20V23H11V20H13M4.92,3.5L7.05,5.64L5.64,7.05L3.5,4.93L4.92,3.5M16.95,18.36L18.36,16.95L19.78,18.36L18.36,19.78L16.95,18.36M19.78,5.64L18.36,7.05L16.95,5.64L18.36,4.22L19.78,5.64M7.05,18.36L4.93,20.5L3.5,19.07L5.64,16.95L7.05,18.36Z" /></svg>
                    <input type="range" min="50" max="150" value="100" id="brightness-slider">
                </div>
            </div>
            <div class="conversion-options">
                <button id="object-remover-btn" class="tool-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15,16H13V13H10V11H13V8H15V11H18V13H15V16M20,2H4A2,2 0 0,0 2,4V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V4A2,2 0 0,0 20,2M20,20H4V4H20V20Z"></path></svg>
                    Object Remover
                </button>
                
                <label class="toggle-switch-label">
                    <input type="checkbox" id="majestic-mode-toggle" class="toggle-switch-input">
                    <span class="toggle-switch-slider"></span>
                    Theater/Majestic Mode
                </label>

                <label for="quality-select">Download Quality:</label>
                <select id="quality-select" name="quality">
                    <option value="1080">1080p (HD)</option>
                    <option value="1440">1440p (2K)</option>
                    <option value="2160" class="premium-option" disabled>2160p (4K) 👑</option>
                    <option value="original" class="premium-option" disabled>Original 👑</option>
                </select>
                <button id="download-btn" class="download-btn">Download photo</button>
            </div>
        </section>
    </main>

    <footer class="tutorial-section">
        <h2>How to use the photo enhancer.</h2>
        <ul>
            <li>Take a picture, wait for the loading animation to finish.</li>
            <li>Use the clear tool to change the lighting of the photo.</li>
            <li>And your set to change quality of the photo.</li>
        </ul>
    </footer>
    <canvas id="canvas" style="display:none;"></canvas>
    <script src="photo.js" defer></script>
</body>
</html>
