<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Converter</title>
    <meta name="description" content="your best #1 free converter convert your clips to mp3, mp4, and even improve your video quality all for free.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crown-icon-definition" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path d="M452.5 192.5L416 205.1l-33.5-12.6-12.6 33.5-33.5-12.6-12.6 33.5-33.5-12.6-12.6 33.5-33.5-12.6L192.5 192.5 160 179.9l-12.6 33.5-33.5-12.6-12.6 33.5-33.5-12.6L59.5 256l12.6 33.5-33.5 12.6 33.5 12.6 12.6-33.5 33.5 12.6 12.6-33.5 33.5 12.6 12.6-33.5 33.5 12.6L256 256l33.5 12.6 12.6-33.5 33.5 12.6 12.6-33.5 33.5 12.6 12.6-33.5 33.5 12.6 12.6-33.5L452.5 192.5zM256 64L320 160H192L256 64zM128 448h256V256H128v192z"/>
        </svg>
    </div>

    <nav class="navbar">
        <a href="https://discord.gg/yWErcPvkVt" target="_blank" class="logo">
            <u>Clip Converter</u> <sup>beta</sup>
        </a>
        <div class="nav-user" id="nav-user"></div>
        <a href="accountcreation.html" class="signin-btn" id="signin-btn">Sign In</a>
    </nav>

    <div class="container">
        <div class="animation-text">
            <span class="clip">Clip</span> it <span class="enhance">improve</span> it.
        </div>

        <div class="file-upload-container" id="file-upload-container">
            <label for="file-upload-video" class="custom-file-upload">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="80" height="80"><path d="M9.984 12.984v-6h4.031v6h2.906l-4.922 4.922-4.922-4.922h2.906zM18.984 9c0-2.203-1.781-3.984-3.984-3.984-1.641 0-3.047 1.031-3.609 2.484-0.188-0.047-0.375-0.047-0.563-0.047-1.406 0-2.578 0.844-3.141 2.016-1.547 0.188-2.672 1.547-2.672 3.094 0 1.734 1.406 3.141 3.141 3.141h10.266c1.359 0 2.484-1.125 2.484-2.484 0-1.266-0.938-2.297-2.156-2.438-0.234-1.266-1.266-2.25-2.531-2.25z" fill="#ffffff"></path></svg>
            </label>
        </div>

        <div class="loading-bar-wrapper">
            <div class="loading-bar"></div>
            <span class="loading-percent">0%</span>
        </div>
        
        <div class="media-processing-area">
            <div class="media-tabs">
                <button class="media-tab-link active" data-tab="video-tab">Video</button>
                <button class="media-tab-link" data-tab="photo-tab">Photo</button>
                <button class="media-tab-link" data-tab="config-tab">Video Config</button>
            </div>

            <div id="video-tab" class="media-tab-content active">
                <div class="media-column">
                    <video id="video-preview" controls></video>
                    <input id="file-upload-video" type="file" accept="video/*,.mov,.mp4,.avi,.mkv,.webm,.flv">
                </div>
                <div class="options-column">
                    <label for="convert-select">Convert to:</label>
                    <select id="convert-select" name="format">
                        <option value="mp4">MP4</option><option value="mp3">MP3</option><option value="mov">MOV</option><option value="avi">AVI</option><option value="mkv">MKV</option><option value="webm">WEBM</option><option value="flv">FLV</option>
                    </select>
                    <label for="quality-select-video">Change quality:</label>
                    <select id="quality-select-video" name="quality">
                        <option value="480p">480p</option><option value="720p">720p</option><option value="1080p">1080p</option>
                        <option value="1440p" class="premium-option" disabled>1440p</option>
                        <option value="4k" class="premium-option" disabled>4k</option>
                    </select>
                    <button class="download-btn">Download</button>
                </div>
            </div>

            <div id="photo-tab" class="media-tab-content">
                <div class="media-column">
                    <img id="photo-preview" src="" alt="Photo Preview">
                    <label for="file-upload-photo" class="custom-file-upload small-upload-btn">Upload Photo</label>
                    <input id="file-upload-photo" type="file" accept="image/*">
                </div>
                <div class="options-column">
                    <label for="quality-select-photo">Change photo quality:</label>
                    <select id="quality-select-photo" name="quality">
                        <option value="480p">480p</option><option value="720p">720p</option><option value="1080p">1080p</option>
                        <option value="1440p" class="premium-option" disabled>1440p</option>
                        <option value="4k" class="premium-option" disabled>4K</option>
                    </select>
                    <button class="download-btn">Download Photo</button>
                </div>
            </div>
            
            <div id="config-tab" class="media-tab-content">
                <div class="premium-blocker">
                    <div class="crown-icon large"></div>
                    <p>Premium feature only</p>
                </div>
                <div class="media-column">
                    <video id="config-video-preview" controls></video>
                    <label for="file-upload-config" class="custom-file-upload small-upload-btn">Upload Video</label>
                    <input id="file-upload-config" type="file" accept="video/*">
                </div>
                <div class="options-column">
                    <label for="prompt-input">Enter prompt to change video:</label>
                    <input type="text" id="prompt-input" placeholder="e.g., make the sky blue">
                    <label for="quality-select-config">Change quality:</label>
                    <select id="quality-select-config" name="quality">
                        <option value="1080p">1080p</option>
                        <option value="1440p">1440p</option><option value="4k">4K</option>
                        <option value="8k" class="premium-option" disabled>8K</option>
                        <option value="10k" class="premium-option" disabled>10K (Best)</option>
                    </select>
                    <button class="download-btn">Download Result</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="tutorial-section">
        <h2>How to use the website.</h2>
        <ul>
            <li>Select the clip you want to use.</li>
            <li>Wait for the loading clip animation to finish. <a href="premiumlist.html">Click here</a> for premium and faster loading.</li>
            <li>After loading, you can change your video quality and format.</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
