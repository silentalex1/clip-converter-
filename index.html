<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Converter</title>
    <meta name="description" content="your best #1 free converter convert your clips to mp3, mp4, and even improve your video quality all for free.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="https://discord.gg/yWErcPvkVt" target="_blank" class="logo">
            <u>Clip Converter</u> <sup>beta</sup>
        </a>
        <div class="nav-user" id="nav-user"></div>
        <a href="accountcreation.html" class="signin-btn" id="signin-btn">Sign In</a>
    </nav>

    <div class="container">
        <div class="main-content">
            <div class="animation-text">
                <span class="clip">Clip</span> it <span class="enhance">enhance</span> it.
            </div>

            <div class="file-upload-container" id="file-upload-container">
                <label for="file-upload-video" class="custom-file-upload">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="80" height="80"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" fill="#ffffff"></path></svg>
                </label>
            </div>

            <div class="loading-bar-wrapper">
                <div class="loading-bar"></div>
                <span class="loading-percent">0%</span>
            </div>
            
            <div class="media-processing-area">
                <div class="media-tabs">
                    <button class="media-tab-link active" data-tab="video-tab">Video</button>
                    <button class="media-tab-link" data-tab="photo-tab">Photo Studio</button>
                    <button class="media-tab-link" data-tab="config-tab">Video Config</button>
                </div>

                <div id="video-tab" class="media-tab-content active">
                    <div class="media-preview-wrapper">
                        <video id="video-preview" controls></video>
                        <input id="file-upload-video" type="file" accept="video/*,.mov,.mp4,.avi,.mkv">
                    </div>
                    <div class="media-options-grid">
                        <div class="option-item">
                            <label for="convert-select">Convert Format</label>
                            <select id="convert-select">
                                <option value="mp4">MP4 (Universal)</option>
                                <option value="mp3">MP3 (Audio Only)</option>
                                <option value="mov">MOV (High Quality)</option>
                            </select>
                        </div>
                        <div class="option-item">
                            <label for="quality-select-video">Video Resolution</label>
                            <select id="quality-select-video">
                                <option value="720p">720p HD</option>
                                <option value="1080p" selected>1080p Full HD</option>
                                <option value="1440p" class="premium-option" disabled>1440p QHD 👑</option>
                                <option value="4k" class="premium-option" disabled>4K UHD 👑</option>
                            </select>
                        </div>
                    </div>
                    <button class="download-btn">Process Video</button>
                </div>

                <div id="photo-tab" class="media-tab-content">
                </div>
                
                <div id="config-tab" class="media-tab-content">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
