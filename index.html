<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Photo Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div id="app">
        <div id="step-1" class="panel active">
            <div class="top-part">
                <div class="dot"></div>
                <h1>Live Photo Maker</h1>
                <p>Turn your videos into live photos.</p>
            </div>

            <div class="box">
                <div class="row">
                    <label>Video Quality</label>
                    <select id="quality">
                        <option value="1280">Standard</option>
                        <option value="1920">HD</option>
                        <option value="3840">4K</option>
                        <option value="7680">8K (Max)</option>
                    </select>
                </div>
            </div>

            <input type="file" id="video-file" accept="video/*" hidden>
            <button id="pick-btn" class="big-btn">Choose Video</button>
            <p class="small">Max 10 seconds</p>
        </div>

        <div id="step-2" class="panel">
            <div class="loader"></div>
            <h2>Making your photo...</h2>
            <div class="bar-container">
                <div id="fill"></div>
            </div>
            <div class="stats">
                <span id="percent">0%</span>
                <span id="frame-count">Frame 0</span>
            </div>
        </div>

        <div id="step-3" class="panel">
            <div class="preview-box">
                <video id="view" loop muted playsinline></video>
            </div>
            <h2>All Done!</h2>
            <p>Your video is ready to download.</p>
            <button id="save-btn" class="big-btn success">Download Now</button>
            <button onclick="location.reload()" class="link-btn">Start Over</button>
        </div>
    </div>

    <canvas id="work-canvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
