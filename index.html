<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipConverter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden flex items-center justify-center font-sans">

    <div id="intro-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 transition-opacity duration-1000">
        <div id="intro-icon" class="w-24 h-24 text-blue-500 transition-all duration-1000 ease-in-out">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-full h-full">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z" />
            </svg>
        </div>
    </div>

    <div id="main-interface" class="relative w-full h-full max-w-6xl mx-auto flex flex-col items-center justify-center opacity-0 transition-opacity duration-1000 p-6">
        
        <div id="upload-section" class="flex flex-col items-center justify-center w-full transition-all duration-700">
            <input type="file" id="file-input" class="hidden" accept="video/*,image/*">
            <button id="choose-clip-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                Choose Clip
            </button>
            <p class="mt-4 text-gray-400 text-sm">Supports all video formats. No size limit.</p>
        </div>

        <div id="loading-container" class="w-full max-w-lg hidden mt-8">
            <div class="flex justify-between mb-2">
                <span class="text-sm font-medium text-blue-400">Processing...</span>
                <span id="progress-text" class="text-sm font-medium text-blue-400">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-4 rounded-full transition-all duration-200 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <div id="editor-section" class="hidden w-full h-full flex-row items-center justify-between gap-8 transition-all duration-1000 transform translate-y-10 opacity-0">
            
            <div id="video-wrapper" class="w-1/2 flex items-center justify-center p-4 bg-gray-800 rounded-2xl shadow-2xl h-[500px] border border-gray-700 transition-all duration-1000">
                <video id="user-video" class="max-w-full max-h-full rounded-lg" controls playsinline></video>
            </div>

            <div id="controls-wrapper" class="w-1/2 flex flex-col gap-6 p-8 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 transform translate-x-10 transition-all duration-1000">
                <h2 class="text-2xl font-bold text-white mb-2 border-b border-gray-600 pb-2">Export Settings</h2>

                <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                    <div class="flex flex-col">
                        <span class="font-semibold text-lg">No Lag</span>
                        <span class="text-xs text-gray-400">Optimizes bitrate for smoothness</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                    <div class="flex flex-col">
                        <span class="font-semibold text-lg">No Noise Suppression</span>
                        <span class="text-xs text-gray-400">Removes background static</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                    </label>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold">Convert To Format</label>
                    <div class="relative">
                        <select id="format-select" class="block appearance-none w-full bg-gray-700 border border-gray-600 text-white py-3 px-4 pr-8 rounded leading-tight focus:outline-none focus:bg-gray-600 focus:border-gray-500">
                            <option value="mp4">MP4</option>
                            <option value="avi">AVI</option>
                            <option value="mov">MOV</option>
                            <option value="webm">WEBM</option>
                            <option value="mkv">MKV</option>
                            <option value="gif">GIF</option>
                            <option value="mp3">MP3 (Audio Only)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-white">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <button id="download-btn" class="mt-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-4 rounded-lg shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    Download Clip
                </button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
