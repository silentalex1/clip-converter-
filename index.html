<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-container">
        <div id="upload-section">
            <h1>Clip Converter</h1>
            <p>Convert your video clips.</p>
            <input type="file" id="video-input" accept="video/*" hidden>
            <button id="upload-btn">Select Video (Max 10s)</button>
        </div>

        <div id="loading-section" class="hidden">
            <h2>Processing your clip...</h2>
            <div class="progress-bar-container">
                <div id="progress-fill"></div>
            </div>
            <p id="percentage">0%</p>
        </div>

        <div id="result-section" class="hidden">
            <h2>Conversion Complete!</h2>
            <p>Your video has been enhanced to the highest quality and converted to a Live Photo.</p>
            <button class="download-btn">Download Live Photo</button>
            <button onclick="location.reload()" class="back-btn">Convert Another</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
