<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Live Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer"></div>
    
    <main id="view-port">
        <div id="main-card">
            <section id="page-1" class="screen active">
                <header>
                    <div class="blue-dot"></div>
                    <h1>Live Converter</h1>
                    <p>Convert clips into high-quality live files.</p>
                </header>

                <div class="settings">
                    <div class="input-group">
                        <label>Output Quality</label>
                        <select id="size-pick">
                            <option value="1280">Standard (720p)</option>
                            <option value="1920">High (1080p)</option>
                            <option value="3840">Ultra (4K)</option>
                            <option value="7680">Master (8K)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>File Type</label>
                        <select id="type-pick">
                            <option value="video/quicktime|.mov">Live Photo (.mov)</option>
                            <option value="video/mp4|.mp4">Standard Video (.mp4)</option>
                        </select>
                    </div>
                </div>

                <div class="bottom-box">
                    <input type="file" id="file-get" accept="video/*" hidden>
                    <button id="go-btn" class="main-btn">Choose Video Clip</button>
                    <p class="hint">Max time: 10 seconds</p>
                </div>

                <div class="info-line">
                    <p>Real-time scaling and bitrate control active.</p>
                </div>
            </section>

            <section id="page-2" class="screen">
                <div class="loading-art">
                    <div class="outer-ring"></div>
                    <div class="inner-dot"></div>
                </div>
                <h2>Converting...</h2>
                <div class="bar-bg">
                    <div id="bar-move"></div>
                </div>
                <div class="numbers">
                    <span id="pct-show">0%</span>
                    <span id="fr-show">Frame 0</span>
                </div>
            </section>

            <section id="page-3" class="screen">
                <div class="media-box">
                    <video id="view-final" loop muted playsinline></video>
                    <div id="res-tag">8K</div>
                </div>
                <h2>Ready to Save</h2>
                <p>Your file has been scaled and fixed.</p>
                <button id="save-btn" class="main-btn green">Download File</button>
                <button onclick="location.reload()" class="sub-btn">Start New</button>
            </section>
        </div>
    </main>

    <canvas id="core-engine" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
