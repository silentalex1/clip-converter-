<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Video Pro Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer"></div>
    
    <main id="main-content">
        <div id="start-screen" class="ui-box active">
            <header>
                <div class="blue-dot"></div>
                <h1>Video Pro Tool</h1>
                <p>Change your video quality and type easily.</p>
            </header>

            <div class="settings">
                <div class="set-row">
                    <label>Video Size</label>
                    <select id="size-pick">
                        <option value="1280">Standard (720p)</option>
                        <option value="1920">High (1080p)</option>
                        <option value="3840">Ultra (4K)</option>
                        <option value="7680">Master (8K)</option>
                    </select>
                </div>

                <div class="set-row">
                    <label>File Type</label>
                    <select id="type-pick">
                        <option value="video/mp4">MP4 File</option>
                        <option value="video/quicktime">MOV File</option>
                        <option value="video/webm">WebM File</option>
                    </select>
                </div>
            </div>

            <input type="file" id="input-field" accept="video/*" hidden>
            <button id="pick-button" class="action-btn">Choose Video</button>
            <p class="small-text">Works best with videos under 10 seconds.</p>
        </div>

        <div id="work-screen" class="ui-box">
            <div class="spin-icon"></div>
            <h2>Building Video...</h2>
            <div class="meter-bg">
                <div id="meter-bar"></div>
            </div>
            <div class="labels">
                <span id="label-pc">0%</span>
                <span id="label-fr">Frame 0</span>
            </div>
        </div>

        <div id="final-screen" class="ui-box">
            <div class="view-window">
                <video id="output-view" loop muted playsinline></video>
            </div>
            <h2>Video Ready</h2>
            <p>Your new video is ready to be saved.</p>
            <button id="save-button" class="action-btn green">Save Video</button>
            <button onclick="location.reload()" class="plain-btn">Start New</button>
        </div>

        <div class="bottom-spacer"></div>
    </main>

    <canvas id="hidden-canvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
