<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Clip Converter</title>
    <link rel="stylesheet" href="accountreg.css">
</head>
<body>
    <div class="form-container">
        <div class="tabs">
            <button class="tab-link active" data-tab="login">Login</button>
            <button class="tab-link" data-tab="create">Create Account</button>
        </div>
        <div id="login" class="tab-content active">
            <form id="login-form">
                <input type="text" placeholder="Enter your username" required>
                <input type="password" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="create" class="tab-content">
            <form id="create-form">
                <input type="text" id="create-username" placeholder="Enter your username" required>
                <input type="password" id="create-password" placeholder="Enter your password" required>
                <input type="email" id="create-email" placeholder="Enter your email" required>
                <button type="submit">Create Account</button>
            </form>
        </div>
        
        <div class="tooltip-container">
            <div class="question-mark">?</div>
            <div class="tooltip-box">If you do not have an account, please create one.</div>
        </div>
    </div>
    <script src="accountsystem.js"></script>
</body>
</html>
