<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify - Clip Converter</title>
    <link rel="stylesheet" href="verifystyle.css">
</head>
<body>
    <div class="verify-container">
        <h2>Verify Your Account</h2>
        <div class="user-info" id="user-info">
        </div>
        <p>Enter the verification code that was sent to you.</p>
        <form id="verify-form">
            <input type="text" id="code-input" placeholder="Verification Code" maxlength="6" required>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="backend.js"></script>
</body>
</html>
